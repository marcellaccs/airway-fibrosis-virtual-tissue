<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="860" viewBox="0 0 1340 860" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1340" height="860" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold">Target model for the Frontiers paper (roadmap revision 2026-10-29)</text>
  <text x="30" y="54" fill="#555">Same lattice, scale and ODE as 434bc94. Additions in teal. Every addition has a switch; all off reproduces the current model.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker>
    <marker id="arrt" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>

  <text x="30" y="92" font-size="15" font-weight="bold">TISSUE LAYER</text>

  <!-- Lumen -->
  <rect x="30" y="100" width="640" height="60" fill="#f4f6f8" stroke="#999"/>
  <text x="40" y="120" font-weight="bold">Lumen  (rows 80 to 99, Medium)</text>
  <text x="40" y="140" fill="#555">Readout: lumen area. Now displaced by matrix volume, not by myofibroblast swelling.</text>

  <!-- Epithelium -->
  <rect x="30" y="160" width="640" height="96" fill="#e3f0e3" stroke="#999"/>
  <text x="40" y="180" font-weight="bold">Epithelium  (rows 72 to 79): 25 stationary cells, count conserved</text>
  <g>
    <rect x="40" y="190" width="22" height="22" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="64" y="190" width="22" height="22" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="88" y="190" width="22" height="22" fill="#d98c8c" stroke="#8a2e2e"/>
    <rect x="112" y="190" width="22" height="22" fill="#d98c8c" stroke="#8a2e2e"/>
    <rect x="136" y="190" width="22" height="22" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="160" y="190" width="22" height="22" fill="#8fc98f" stroke="#2e6b2e"/>
  </g>
  <text x="195" y="200">healthy / damaged. Damaged fraction tracks f_d every MCS, so the arms stay matched.</text>
  <text x="195" y="216" fill="#555">secretes G (damaged 10x healthy, A19b, to calibrate) and C (basal)</text>
  <text x="40" y="236" fill="#0b7a75" font-weight="bold">NEW</text>
  <text x="80" y="236" fill="#0b7a75">secretes P under WS (damaged 2x healthy, A19a) and MMP rising with local P (Zou: epithelial MMP)</text>
  <text x="80" y="251" fill="#0b7a75">repair slowed by local P, sped by uniform A:  p_repair = e4 (1 + e8 M2tot + e9 A) / (1 + k_P P_local)</text>

  <!-- Subepithelium -->
  <rect x="30" y="256" width="640" height="396" fill="#fff7e6" stroke="#999"/>
  <text x="40" y="276" font-weight="bold">Subepithelium  (rows 4 to 71): mesenchyme, matrix objects, four fields</text>

  <ellipse cx="80" cy="312" rx="18" ry="12" fill="#f3d27a" stroke="#8a6d1f"/>
  <text x="110" y="308" font-weight="bold">Fibroblast</text>
  <text x="110" y="324" fill="#555">chemotaxes up G; G >= threshold -> myofibroblast (rate to be calibrated, currently too fast);</text>
  <text x="110" y="340" fill="#0b7a75">mitosis gate reads G_local + k_prolif P_local (IL-6 / STAT3 route into the pool)</text>

  <ellipse cx="80" cy="380" rx="22" ry="12" fill="#e0a060" stroke="#7a4a10"/>
  <text x="110" y="376" font-weight="bold">Myofibroblast</text>
  <text x="110" y="392" fill="#555">secretes G; stiffens with C.  Volume growth with C reduced or removed.</text>
  <text x="110" y="408" fill="#0b7a75">deposits matrix as ECM cells (budget 0.08/MCS on contact; one cell per quantum, placed adjacent)</text>
  <text x="110" y="424" fill="#0b7a75">reduces local MMP (TIMP term, Chandrasegaran 2025)</text>

  <g>
    <rect x="62" y="446" width="14" height="14" fill="#d9c7a3" stroke="#8a7a4a"/>
    <rect x="78" y="446" width="14" height="14" fill="#d9c7a3" stroke="#8a7a4a"/>
    <rect x="70" y="462" width="14" height="14" fill="#d9c7a3" stroke="#8a7a4a"/>
  </g>
  <text x="110" y="456" font-weight="bold" fill="#0b7a75">ECM cell (NEW, volume-occupying)</text>
  <text x="110" y="472" fill="#0b7a75">passive 7 um objects, cohesive. Occupy space: cap mesenchymal density, push the sheet.</text>
  <text x="110" y="488" fill="#0b7a75">removed when local MMP >= MMP_thr. Collagen area fraction = ECM pixels. K on ECM.</text>

  <text x="40" y="516" font-weight="bold">Recruitment</text>
  <text x="140" y="516" fill="#555">unchanged: R_fib = 0.001, bottom rows, G-weighted.</text>

  <!-- Fields: four boxes -->
  <rect x="40" y="530" width="150" height="112" fill="#eef3ff" stroke="#6a84c4"/>
  <text x="48" y="548" font-weight="bold" fill="#2b4a9a">G  growth factor</text>
  <text x="48" y="565" fill="#333" font-size="12">diffuses, decays</text>
  <text x="48" y="580" fill="#333" font-size="12">+ uniform S_M2</text>
  <text x="48" y="595" fill="#333" font-size="12">read: chemotaxis,</text>
  <text x="48" y="610" fill="#333" font-size="12">conversion, mitosis</text>
  <text x="48" y="630" fill="#8a2e2e" font-size="12">to calibrate (table)</text>

  <rect x="200" y="530" width="150" height="112" fill="#f3eef8" stroke="#8a6bb0"/>
  <text x="208" y="548" font-weight="bold" fill="#5b3a8a">C  stiffness burden</text>
  <text x="208" y="565" fill="#333" font-size="12">no diffusion</text>
  <text x="208" y="580" fill="#333" font-size="12">decay 0.0005</text>
  <text x="208" y="595" fill="#0b7a75" font-size="12">+ k * MMP_local</text>
  <text x="208" y="610" fill="#333" font-size="12">read: lambdaVolume</text>
  <text x="208" y="630" fill="#333" font-size="12">via c_norm</text>

  <rect x="360" y="530" width="150" height="112" fill="#e6f4f3" stroke="#0b7a75"/>
  <text x="368" y="548" font-weight="bold" fill="#0b7a75">P  pro-inflammatory</text>
  <text x="368" y="565" fill="#333" font-size="12">diffuses, decays (short)</text>
  <text x="368" y="580" fill="#333" font-size="12">epithelium under WS</text>
  <text x="368" y="595" fill="#333" font-size="12">+ uniform S_M1 (ODE)</text>
  <text x="368" y="610" fill="#333" font-size="12">read: repair, mitosis,</text>
  <text x="368" y="625" fill="#333" font-size="12">MMP secretion</text>

  <rect x="520" y="530" width="140" height="112" fill="#e6f4f3" stroke="#0b7a75"/>
  <text x="528" y="548" font-weight="bold" fill="#0b7a75">MMP  protease</text>
  <text x="528" y="565" fill="#333" font-size="12">diffuses, decays</text>
  <text x="528" y="580" fill="#333" font-size="12">epithelium, rises</text>
  <text x="528" y="595" fill="#333" font-size="12">with P; TIMP by myof.</text>
  <text x="528" y="610" fill="#333" font-size="12">read: ECM removal,</text>
  <text x="528" y="625" fill="#333" font-size="12">C decay</text>

  <!-- Outer boundary -->
  <rect x="30" y="652" width="640" height="30" fill="#d9d9d9" stroke="#999"/>
  <text x="40" y="672" font-weight="bold">Outer boundary  (rows 0 to 3): frozen. Unchanged.</text>

  <!-- Loops panel -->
  <rect x="30" y="700" width="640" height="140" fill="#fbfbfb" stroke="#bbb"/>
  <text x="40" y="720" font-weight="bold">The loops that could carry or erase pattern dependence (Gate D ablation)</text>
  <text x="40" y="740" fill="#0b7a75">+  damaged focus -> P -> slower repair there -> focus persists        (repair gating)</text>
  <text x="40" y="758" fill="#0b7a75">+  P -> more fibroblast division near the focus -> more conversion     (proliferation)</text>
  <text x="40" y="776" fill="#555">+  myofibroblast -> G -> recruits and converts neighbours              (already present)</text>
  <text x="40" y="794" fill="#8a2e2e">-  P -> epithelial MMP -> matrix removed near the focus                (MMP, the only negative loop)</text>
  <text x="40" y="812" fill="#8a2e2e">-  ECM cells cap density and spread the lesion mechanically           (volume occupation)</text>
  <text x="40" y="830" fill="#333">Conditions: (0) all off (1) +repair (2) +prolif (3) +MMP (4) +ECM cells (5) all on. Focal vs diffuse in each.</text>

  <!-- ODE panel -->
  <text x="720" y="92" font-size="15" font-weight="bold">ODE LAYER (unchanged, one-way)</text>
  <rect x="720" y="100" width="600" height="190" fill="#fbf5f5" stroke="#b07070"/>
  <text x="732" y="122" font-weight="bold">Input WS(t): three 1 h pulses / 24 h.  States E_h, E_d, M1, M2, M0R, M1R, M2R, P, A.</text>
  <text x="732" y="146" fill="#333">Sits on its periodic attractor; the tissue reads near-constants (A11):</text>
  <text x="732" y="164" font-family="Menlo, Consolas, monospace" font-size="12">M2tot = 0.446   A = 0.95   f_d = 0.113   M1tot = (read at attractor)</text>
  <text x="732" y="190" fill="#333">Published JTB equations, Antimony string, libRoadRunner, 1 h per MCS.</text>
  <text x="732" y="208" fill="#333">Nothing is written back. Two clocks documented, rates converted on the tissue clock.</text>
  <text x="732" y="236" fill="#8a2e2e">A19a (2:1 on P) is the ODE's claim and is inherited, not fitted.</text>
  <text x="732" y="254" fill="#8a2e2e">A19b (ratio on G) is the tissue's claim: calibration-table item, Jones assay 1.</text>

  <text x="720" y="322" font-weight="bold">ODE -> tissue, every MCS</text>
  <line x1="716" y1="344" x2="672" y2="586" stroke="#b03030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="348" fill="#b03030">1. S_M2 = k (M2 + M2R), uniform into G (the control that holds immune drive flat)</text>
  <line x1="716" y1="374" x2="672" y2="200" stroke="#b03030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="378" fill="#b03030">2. f_d sets the damaged fraction (focal or diffuse placement, the experiment)</text>
  <line x1="716" y1="404" x2="672" y2="246" stroke="#b03030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="408" fill="#b03030">3. e4, e8, e9, M2tot, A into the repair rate (now also divided by 1 + k_P P_local)</text>
  <line x1="716" y1="434" x2="672" y2="586" stroke="#0b7a75" stroke-width="2" marker-end="url(#arrt)"/>
  <text x="726" y="438" fill="#0b7a75">4. NEW  S_M1 = k (M1 + M1R), uniform into P (macrophage cytokine proxy)</text>

  <text x="720" y="480" font-weight="bold">tissue -> ODE</text>
  <line x1="672" y1="500" x2="716" y2="500" stroke="#999" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrg)"/>
  <text x="726" y="504" fill="#666">still none. The loops change what the tissue does with the ODE's constants;</text>
  <text x="726" y="520" fill="#666">the global damaged fraction stays pinned to f_d, so the arms stay matched.</text>

  <!-- Readouts -->
  <rect x="720" y="546" width="600" height="136" fill="#f7f7f7" stroke="#bbb"/>
  <text x="732" y="566" font-weight="bold">Readouts (Gate C, mostly free from the build)</text>
  <text x="732" y="586" fill="#333">collagen area fraction (ECM pixels / band area), subepithelial thickness, myofibroblast density,</text>
  <text x="732" y="604" fill="#333">lumen area, counts, G/C/P/MMP band means, repair events, divisions, ECM placed and removed,</text>
  <text x="732" y="622" fill="#333">Ripley's K(r/d) on ECM with d fixed first, P-analogue on the chip's clock (days 3, 6, 12, 15).</text>
  <text x="732" y="646" fill="#8a2e2e">Pass criterion (pre-registered): focal and diffuse separate on K(r/d) while collagen area fraction does not.</text>
  <text x="732" y="664" fill="#8a2e2e">Result of the paper: the table of which conditions (0) to (5) separate.</text>

  <!-- Still out -->
  <text x="720" y="712" font-weight="bold">Still out of this paper</text>
  <text x="720" y="730" fill="#666">EMT (adds mesenchyme at the damage site, confounds the test), ASM, annulus, adventitia, antioxidant,</text>
  <text x="720" y="746" fill="#666">latent/active TGF-b split and stiffness gating (forward predictions only), two-way coupling.</text>

  <text x="720" y="786" font-weight="bold">Calibration in parallel (Jones lab, ELISA scope)</text>
  <text x="720" y="804" fill="#666">1 epithelium + smoke extract: TGF-b1, IL-6, IL-8, LDH.  2 fibroblast + TGF-b1: a-SMA, PICP, TGF-b1.</text>
  <text x="720" y="820" fill="#666">3 MMP-2/-9, TIMP-1.  4 proliferation (MTT) vs TGF-b1, IL-6.  5 conditioned-medium transfer.</text>
</svg>
