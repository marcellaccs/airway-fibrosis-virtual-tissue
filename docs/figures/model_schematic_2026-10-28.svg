<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="800" viewBox="0 0 1340 800" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1340" height="800" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold">Subepithelial fibrosis virtual tissue, state at commit 434bc94 (2026-10-27)</text>
  <text x="30" y="54" fill="#555">Tissue layer: 200 x 100 px, 1 px = 1.25 um, 1 MCS = 62.4 s, 20 000 MCS = 14.4 d. ODE layer: published JTB model, live in libRoadRunner, 1 h per MCS.</text>

  <!-- Tissue panel -->
  <text x="30" y="92" font-size="15" font-weight="bold">TISSUE LAYER (CompuCell3D, 2D cross-section, y up)</text>

  <!-- Lumen -->
  <rect x="30" y="100" width="640" height="90" fill="#f4f6f8" stroke="#999"/>
  <text x="40" y="120" font-weight="bold">Lumen  (rows 80 to 99, Medium)</text>
  <text x="40" y="140" fill="#555">4000 px at t = 0. Readout: lumen area, % change. Baseline now -2.5 % (n = 6).</text>
  <text x="40" y="160" fill="#555">Nothing lives here. The sheet is pushed into it from below.</text>

  <!-- Epithelium -->
  <rect x="30" y="190" width="640" height="72" fill="#e3f0e3" stroke="#999"/>
  <text x="40" y="210" font-weight="bold">Epithelium  (rows 72 to 79): 25 cells, 8 x 8 px, stationary, count conserved</text>
  <g>
    <rect x="40" y="222" width="24" height="24" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="66" y="222" width="24" height="24" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="92" y="222" width="24" height="24" fill="#d98c8c" stroke="#8a2e2e"/>
    <rect x="118" y="222" width="24" height="24" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="144" y="222" width="24" height="24" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="170" y="222" width="24" height="24" fill="#8fc98f" stroke="#2e6b2e"/>
    <rect x="196" y="222" width="24" height="24" fill="#d98c8c" stroke="#8a2e2e"/>
    <rect x="222" y="222" width="24" height="24" fill="#8fc98f" stroke="#2e6b2e"/>
  </g>
  <text x="260" y="233">green = Healthy (G 0.01)   red = Damaged (G 0.1)</text>
  <text x="260" y="251" fill="#555">healthy -> damaged tracks f_d;  damaged -> healthy at p_repair (new 10-27)</text>

  <!-- Subepithelium -->
  <rect x="30" y="262" width="640" height="330" fill="#fff7e6" stroke="#999"/>
  <text x="40" y="282" font-weight="bold">Subepithelium  (rows 4 to 71): mesenchyme and two fields</text>

  <!-- Fibroblast -->
  <ellipse cx="80" cy="330" rx="18" ry="12" fill="#f3d27a" stroke="#8a6d1f"/>
  <text x="110" y="326" font-weight="bold">Fibroblast  (start 11, mobile)</text>
  <text x="110" y="342" fill="#555">chemotaxes up G (lambda 1000); G >= 0.45 -> activation 0.02/MCS -> Myofibroblast (irreversible);</text>
  <text x="110" y="358" fill="#555">G >= 0.225 -> 1730 MCS mitosis clock -> divides; secretes G 0.005; stiffens with C. No death.</text>

  <!-- Myofibroblast -->
  <ellipse cx="80" cy="400" rx="22" ry="12" fill="#e0a060" stroke="#7a4a10"/>
  <text x="110" y="396" font-weight="bold">Myofibroblast  (start 0, static)</text>
  <text x="110" y="412" fill="#555">secretes C 0.08 on contact with Medium; secretes G 0.1; target volume grows up to 3x with c_norm.</text>
  <text x="110" y="428" fill="#555">This volume growth is what displaces the sheet. No division, no reversion, no death.</text>

  <!-- Recruitment -->
  <text x="40" y="460" font-weight="bold">Recruitment</text>
  <text x="140" y="460" fill="#555">1 trial / MCS at R_fib = 0.001, new fibroblast in rows 4 to 8, placed by G weight (about 20 per run).</text>

  <!-- Fields -->
  <rect x="40" y="478" width="300" height="104" fill="#eef3ff" stroke="#6a84c4"/>
  <text x="50" y="497" font-weight="bold" fill="#2b4a9a">Field G: lumped growth factor</text>
  <text x="50" y="514" fill="#333">diffuses 0.10, decays 0.01</text>
  <text x="50" y="530" fill="#333">sources: cells (above) + uniform pedestal S_M2</text>
  <text x="50" y="546" fill="#333">read by: chemotaxis, differentiation (0.45),</text>
  <text x="50" y="562" fill="#333">mitosis (0.225), recruitment placement</text>

  <rect x="360" y="478" width="300" height="104" fill="#f3eef8" stroke="#8a6bb0"/>
  <text x="370" y="497" font-weight="bold" fill="#5b3a8a">Field C: ECM / collagen burden</text>
  <text x="370" y="514" fill="#333">no diffusion, decays 0.0005 (MMP stand-in)</text>
  <text x="370" y="530" fill="#333">sources: myofibroblasts 0.08, epithelium 0.01</text>
  <text x="370" y="546" fill="#333">read by: cell stiffness, myofibroblast volume,</text>
  <text x="370" y="562" fill="#333">via c_norm = C / (C + 20).  The only ratchet.</text>

  <!-- Outer boundary -->
  <rect x="30" y="592" width="640" height="34" fill="#d9d9d9" stroke="#999"/>
  <text x="40" y="614" font-weight="bold">Outer boundary  (rows 0 to 3): one frozen cell. ASM slot. Forces growth inward.</text>

  <!-- Readouts -->
  <text x="30" y="740" font-weight="bold">Readouts today:</text>
  <text x="140" y="740" fill="#333">lumen area, counts by type, G and C band means, sheet position and integrity, repair events, divisions (replicates_summary.csv)</text>
  <text x="30" y="762" font-weight="bold">Not yet:</text>
  <text x="140" y="762" fill="#a33">collagen area fraction, subepithelial thickness, myofibroblast density, Ripley's K(r/d) on C (spatial_stats.py, unwired), focal damage arm</text>

  <!-- ODE panel -->
  <text x="720" y="92" font-size="15" font-weight="bold">ODE LAYER (signal layer, runs on its own)</text>
  <rect x="720" y="100" width="600" height="300" fill="#fbf5f5" stroke="#b07070"/>
  <text x="732" y="122" font-weight="bold">Input: WS(t), three 1 h cooking pulses per 24 h (8, 13, 18 h)</text>
  <text x="732" y="146" font-weight="bold">States (dimensionless)</text>
  <text x="732" y="164">E_h, E_d    healthy / damaged epithelium (f_d = E_d / (E_h + E_d))</text>
  <text x="732" y="182">M1, M2      recruited macrophages;  M0R, M1R, M2R  resident</text>
  <text x="732" y="200">P           pro-inflammatory pool (IL-6 / IL-8 stand-in)</text>
  <text x="732" y="218">A           anti-inflammatory pool</text>
  <text x="732" y="244" font-weight="bold">Lines that matter here</text>
  <text x="732" y="262" font-family="Menlo, Consolas, monospace" font-size="11.5">E_d' = -e2 E_d + e3 WS E_h - e4 (1 + e8 M2tot + e9 A) E_d</text>
  <text x="732" y="280" font-family="Menlo, Consolas, monospace" font-size="11.5">P'   = e5 WS F(E_h) + e6 WS F(E_d) + m6 WS F(A) M1tot - m7 P</text>
  <text x="732" y="298" font-family="Menlo, Consolas, monospace" font-size="11.5">e3 = 0.005  e4 = 0.002  e5 = 0.1  e6 = 0.2  (2:1 damaged:healthy on P)</text>
  <text x="732" y="324" fill="#555">Sits on a periodic attractor: M2tot 0.446, A 0.95 from ~day 27; f_d 0.113 from ~day 83.</text>
  <text x="732" y="342" fill="#555">So the tissue sees near-constants (A11). Clock mismatch (1 h vs 62.4 s per MCS) is</text>
  <text x="732" y="360" fill="#555">documented, not reconciled; repair rate converted on the tissue clock.</text>
  <text x="732" y="386" fill="#8a2e2e">Unchanged from the JTB paper except: smoothed WS edges; e9/e10 numbering in E_h'.</text>

  <!-- Coupling arrows ODE -> tissue -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03030"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <text x="720" y="430" font-weight="bold">ODE -> tissue, every MCS (one-way)</text>
  <line x1="720" y1="452" x2="672" y2="520" stroke="#b03030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="456" fill="#b03030">1. S_M2 = 0.003 M2tot, added uniformly to G (the pedestal; the control in the paper)</text>
  <line x1="720" y1="482" x2="672" y2="236" stroke="#b03030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="486" fill="#b03030">2. f_d sets the damaged fraction of the sheet (diffuse seeding; focal arm not built)</text>
  <line x1="720" y1="512" x2="672" y2="250" stroke="#b03030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="516" fill="#b03030">3. p_repair = e4 (1 + e8 M2tot + e9 A) x h/MCS per damaged cell (Gate B1, 10-27)</text>

  <text x="720" y="556" font-weight="bold">tissue -> ODE</text>
  <line x1="672" y1="580" x2="720" y2="580" stroke="#999" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrg)"/>
  <text x="726" y="584" fill="#666">none. Deferred, not dropped: trigger is a tissue mechanism that changes</text>
  <text x="726" y="600" fill="#666">epithelial damage independently of the ODE (EMT). Nothing does that today.</text>

  <text x="720" y="630" font-weight="bold">Not in the tissue</text>
  <text x="720" y="648" fill="#666">macrophages, P field, MMP field, latent/active TGF-b split, EMT, ASM, adventitia, cell death.</text>

  <text x="720" y="680" font-weight="bold">Headline experiment (Gate D)</text>
  <text x="720" y="698" fill="#333">focal vs diffuse damage at matched total damage, same S_M2.</text>
  <text x="720" y="716" fill="#333">Pass: Ripley's K(r/d) separates while collagen area fraction does not.</text>
</svg>
